# OmniRadar high-level architecture, drawn with sysketch (https://github.com/Tonys-Coding/sysketch).
# Re-render locally (applies the Plaid and Capital One logos from ./logos):
#   npx sysketch render docs/architecture.yaml --png
# The hosted sysketch connector can't read logo folders; drop the `logos:` line there,
# and those two nodes fall back to generic icons.
title: 'OmniRadar: High-Level Architecture'
steps: false
logos: ./logos
nodes:
  you: user | You | browser or phone
  app: nextjs | OmniRadar | Next.js 16 · pages, API, sync
  supabase: supabase | Supabase | sign-in + Postgres (RLS)
  plaid: plaid/cloud | Plaid | bank data API
  boa: bankofamerica | Bank of America | linked
  capitalone: capitalone/cloud | Capital One | next to link
  vercel: vercel | Vercel | hosting + daily sync (planned)
groups:
  Your Banks: [boa, capitalone]
edges:
  - you => app | dashboard
  - app <> supabase | your data, encrypted tokens [teal]
  - app <> plaid | link banks, sync transactions [green]
  - plaid <> boa | read-only access [green]
  - plaid <..> capitalone | next [slate]
  - vercel ..> app | deploy + cron (planned) [slate]
